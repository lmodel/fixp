---
id: https://w3id.org/lmodel/fixp/schema/fixp_core
name: fixp_core
title: FIXP core
description: >-
  The shared parts of this project's model of FIXP 1.0: the abstract datatypes, the value
  lists, the fields the session messages share, and the base every message class extends.
version: "1.0"
source: https://github.com/FIXTradingCommunity/fixp-specification/tree/v1.0-STANDARD/v1-0-STANDARD
license: Apache-2.0
see_also:
  - https://lmodel.github.io/fixp
notes:
  - >-
    A field's aliases give its name in the FIXP specification and in the two resource files.
    Its sbe_field_id and repository_field_id annotations give the number the SBE schema and the
    FIX repository file assign, which differ for five fields. tests/test_coverage.py reads
    them.
prefixes:
  fixp: https://w3id.org/lmodel/fixp/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
  fix_sbe: https://w3id.org/lmodel/fix-sbe/
  fix_orchestra: https://w3id.org/lmodel/fix-orchestra/
default_prefix: fixp
default_range: string

imports:
  - linkml:types

subsets:

  fixp_initialization:
    description: Messages that create a session or announce a flow before any binding.
  fixp_binding:
    description: Messages that bind a session to a transport.
  fixp_transferring:
    description: Messages sent while application messages flow.
  fixp_unbinding:
    description: The message that releases a session from its transport.
  fixp_finalizing:
    description: Messages that close a flow for good.

types:

  fixp_u8:
    description: A whole number from 0 to 255, held in eight unsigned bits.
    typeof: integer
    minimum_value: 0
    maximum_value: 255

  fixp_u16:
    description: A whole number from 0 to 65,535, held in 16 unsigned bits.
    typeof: integer
    minimum_value: 0
    maximum_value: 65535

  fixp_u32:
    description: A whole number from 0 to 4,294,967,295, held in 32 unsigned bits.
    typeof: integer
    minimum_value: 0
    maximum_value: 4294967295
    annotations:
      sbe_type: cardinal
      sbe_primitive_type: uint32

  fixp_u64:
    description: A whole number from 0 to 18,446,744,073,709,551,615, held in 64 unsigned bits.
    typeof: integer
    minimum_value: 0
    maximum_value: 18446744073709551615
    annotations:
      sbe_type: ordinal
      sbe_primitive_type: uint64

  fixp_uuid:
    description: >-
      A random UUID of RFC 4122's version 4, written as 32 hexadecimal digits in five groups
      joined by hyphens.
    typeof: string
    pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$'
    comments:
      - >-
        On the wire it is 16 octets. The pattern checks the version digit and the variant
        bits that RFC 4122 sets for a random UUID.
    see_also:
      - https://www.rfc-editor.org/rfc/rfc4122
    annotations:
      sbe_type: UUID
      sbe_primitive_type: uint8

  fixp_nanotime:
    description: >-
      A moment, counted in nanoseconds since the Unix epoch and held in 64 unsigned bits.
    typeof: integer
    minimum_value: 0
    maximum_value: 18446744073709551615
    unit:
      ucum_code: ns
    comments:
      - >-
        The datatype table names no epoch; the usage examples in the specification's
        appendix A use the Unix epoch.
    annotations:
      sbe_type: nanotime
      sbe_primitive_type: uint64

  fixp_delta_millisecs:
    description: A length of time in whole milliseconds, held in 32 unsigned bits.
    typeof: integer
    minimum_value: 0
    maximum_value: 4294967295
    unit:
      ucum_code: ms
    annotations:
      sbe_type: DeltaMillisecs
      sbe_primitive_type: uint32

  fixp_object:
    description: >-
      Octets that FIXP passes through without reading them, written here in base64.
    typeof: string
    uri: xsd:base64Binary
    pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
    comments:
      - >-
        FIXP leaves the wire form to the encoding. Base64 (RFC 4648, section 4) is this
        schema's choice for writing the octets in YAML and JSON.
    annotations:
      sbe_type: Object

  fixp_string:
    description: Text, in UTF-8.
    typeof: string
    annotations:
      sbe_type: CharacterString

enums:

  FixpFlowType:
    description: >-
      How surely a flow is delivered. A flow is what one side of a session sends the other,
      leaving out session messages.
    comments:
      - The values are listed from the strongest guarantee to none.
    annotations:
      sbe_name: FlowType
      sbe_encoding_type: uint8
    permissible_values:
      Recoverable:
        description: >-
          Every message arrives once and in order; the receiver asks for any gap to be sent
          again.
        annotations:
          sbe_value: "0"
      Idempotent:
        description: >-
          No message takes effect twice; the sender hears of a gap and its application
          decides what to resend.
        annotations:
          sbe_value: "1"
      Unsequenced:
        description: Messages carry no sequence number, and none is ever resent.
        annotations:
          sbe_value: "2"
      None:
        description: This side sends no application messages at all.
        annotations:
          sbe_value: "3"

  FixpMulticastFlowType:
    description: The delivery guarantee a multicast topic announces for its flow.
    comments:
      - >-
        Section 5 and the repository file allow these two values. Section 3 allows a
        multicast Idempotent alone, and the SBE schema reuses the four-value FlowType, which
        tests/upstream_departures.yaml records.
    annotations:
      repository_code_set: FlowCodeSet
    permissible_values:
      Recoverable:
        description: >-
          Sequenced; a listener gets a lost message back over a separate unicast session.
        annotations:
          sbe_value: "0"
      Idempotent:
        description: Sequenced, so a listener can see a loss, but nothing lost comes back.
        annotations:
          sbe_value: "1"

  FixpNegotiationRejectCode:
    description: Why a server refused to create a session.
    annotations:
      sbe_name: NegotiationRejectCode
      sbe_encoding_type: uint8
    permissible_values:
      Credentials:
        description: The server could not identify the client, or would not let it in.
        annotations:
          sbe_value: "0"
      FlowTypeNotSupported:
        description: The server does not offer the flow type the client asked to send.
        annotations:
          sbe_value: "1"
      DuplicateId:
        description: The client chose a session identifier that is not new.
        annotations:
          sbe_value: "2"
      Unspecified:
        description: Some reason the other values do not name.
        annotations:
          sbe_value: "3"

  FixpEstablishmentRejectCode:
    description: Why a server would not bind the session to this transport.
    annotations:
      sbe_name: EstablishmentRejectCode
      sbe_encoding_type: uint8
    permissible_values:
      Unnegotiated:
        description: >-
          The session was never negotiated, or it has been finalized and needs a new
          negotiation.
        annotations:
          sbe_value: "0"
      AlreadyEstablished:
        description: The server had already acknowledged a binding, so this request repeats it.
        annotations:
          sbe_value: "1"
      SessionBlocked:
        description: The client may not use this session.
        annotations:
          sbe_value: "2"
      KeepaliveInterval:
        description: The client's keep-alive interval is outside what the server accepts.
        annotations:
          sbe_value: "3"
      Credentials:
        description: The server could not identify the client, or would not let it in.
        annotations:
          sbe_value: "4"
      Unspecified:
        description: Some reason the other values do not name.
        annotations:
          sbe_value: "5"

  FixpRetransmitRejectCode:
    description: Why a party will not resend the messages its peer asked for.
    annotations:
      sbe_name: RetransmitRejectCode
      sbe_encoding_type: uint8
    permissible_values:
      OutOfRange:
        description: The range asked for runs past the sequence numbers sent so far.
        annotations:
          sbe_value: "0"
      InvalidSession:
        description: The session is unknown, or the one asking may not read it.
        annotations:
          sbe_value: "1"
      RequestLimitExceeded:
        description: The request asks for more messages than the sender resends at once.
        annotations:
          sbe_value: "2"

  FixpTerminationCode:
    description: Why a party releases a session from its transport.
    comments:
      - >-
        The specification lists these values without saying what each one means, apart from
        ReRequestInProgress, so the descriptions read their names.
    annotations:
      sbe_name: TerminationCode
      sbe_encoding_type: uint8
    permissible_values:
      Finished:
        description: An ordinary release, with no error.
        annotations:
          sbe_value: "0"
      UnspecifiedError:
        description: An error that the other values do not name.
        annotations:
          sbe_value: "1"
      ReRequestOutOfBounds:
        description: The peer asked again for messages outside the range sent.
        annotations:
          sbe_value: "2"
      ReRequestInProgress:
        description: The peer asked again for messages while its earlier request was unanswered.
        annotations:
          sbe_value: "3"

slots:

  id:
    description: The identifier of an exchange or a rules-of-engagement record.
    identifier: true
    range: uriorcurie

  description:
    description: Free text about a record, for the people who read it.
    slot_uri: schema:description

  message_kind:
    description: >-
      The class of this message, such as FixpNegotiate. It stands for FIXP's MessageType,
      which every message carries.
    designates_type: true
    range: string
    required: true
    aliases: [MessageType]

  session_id:
    description: The session's identifier, which the client chooses and never uses again.
    range: fixp_uuid
    aliases: [SessionId]
    annotations:
      sbe_field_id: "1"
      repository_field_id: "1"
      repository_datatype: String

  request_time:
    description: When the sender made this request. The answer repeats it, to show what it answers.
    range: fixp_nanotime
    aliases: [Timestamp]
    annotations:
      sbe_field_id: "2"
      repository_field_id: "2"
      repository_datatype: int

  client_flow:
    description: The flow type of the application messages the client will send.
    range: FixpFlowType
    aliases: [ClientFlow]
    annotations:
      sbe_field_id: "3"
      repository_field_id: "3"
      repository_datatype: int

  credentials:
    description: Data that identifies the sender, in a form the two parties agree on.
    range: fixp_object
    aliases: [Credentials]
    annotations:
      sbe_field_id: "4"
      repository_field_id: "4"
      repository_datatype: data

  request_timestamp:
    description: The request_time of the request this message answers.
    range: fixp_nanotime
    aliases: [RequestTimestamp]
    annotations:
      sbe_field_id: "5"
      repository_field_id: "5"
      repository_datatype: int

  server_flow:
    description: The flow type of the application messages the server will send.
    range: FixpFlowType
    aliases: [ServerFlow]
    annotations:
      sbe_field_id: "6"
      repository_field_id: "6"
      repository_datatype: int

  negotiation_reject_code:
    description: Why the server refused to create the session.
    range: FixpNegotiationRejectCode
    aliases: [Code, NegotiationRejectCode]
    annotations:
      sbe_field_id: "7"
      repository_field_id: "7"
      repository_datatype: int

  reason_text:
    description: Free text that says more about the code beside it.
    range: fixp_string
    aliases: [Reason]
    annotations:
      sbe_field_id: "8"
      repository_field_id: "8"
      repository_datatype: String

  keepalive_interval:
    description: >-
      The most milliseconds the sender lets pass without sending anything before it sends a
      heartbeat.
    range: fixp_delta_millisecs
    aliases: [KeepaliveInterval]
    annotations:
      sbe_field_id: "9"
      repository_field_id: "9"
      repository_datatype: int

  topic_classification:
    description: >-
      The lasting subject of a topic's messages, such as a product type or a market symbol.
    range: fixp_object
    aliases: [Classification]
    annotations:
      sbe_field_id: "10"
      repository_field_id: "10"
      repository_datatype: data

  next_seq_no:
    description: The number the sender's next application message will carry.
    range: fixp_u64
    aliases: [NextSeqNo]
    annotations:
      sbe_field_id: "11"
      repository_field_id: "11"
      repository_datatype: int

  establishment_reject_code:
    description: Why the server refused to bind the session.
    range: FixpEstablishmentRejectCode
    aliases: [Code, EstablishmentRejectCode]
    annotations:
      sbe_field_id: "12"
      repository_field_id: "12"
      repository_datatype: int

  from_seq_no:
    description: Where a run of messages starts, by sequence number.
    range: fixp_u64
    aliases: [FromSeqNo]
    annotations:
      sbe_field_id: "13"
      repository_field_id: "13"
      repository_datatype: int

  message_count:
    description: How many messages a range holds.
    range: fixp_u32
    aliases: [Count]
    annotations:
      sbe_field_id: "14"
      repository_field_id: "14"
      repository_datatype: int

  retransmit_reject_code:
    description: Why the sender will not resend the range.
    range: FixpRetransmitRejectCode
    aliases: [Code, RetransmitRejectCode]
    annotations:
      sbe_field_id: "15"
      repository_field_id: "15"
      repository_datatype: int

  termination_code:
    description: Why the party releases the session from the transport.
    range: FixpTerminationCode
    aliases: [Code, TerminationCode]
    annotations:
      sbe_field_id: "16"
      repository_field_id: "16"
      repository_datatype: int

  last_seq_no:
    description: The number carried by the flow's final application message.
    range: fixp_u64
    aliases: [LastSeqNo]
    annotations:
      sbe_field_id: "17"
      repository_field_id: "17"
      repository_datatype: int

  flow:
    description: The flow type of a multicast topic's messages.
    range: FixpMulticastFlowType
    aliases: [Flow]
    annotations:
      sbe_field_id: "8"
      repository_field_id: "18"
      repository_datatype: int

  sofh_encoding_type:
    description: >-
      The code that the Simple Open Framing Header registers for the encoding a template is
      written for.
    range: fixp_u32
    aliases: [EncodingType]
    annotations:
      sbe_field_id: "18"
      repository_field_id: "19"
      repository_datatype: int

  effective_time:
    description: When the template comes into force. Without it, the template applies at once.
    range: fixp_nanotime
    aliases: [EffectiveTime]
    annotations:
      sbe_field_id: "19"
      repository_field_id: "20"
      repository_datatype: int

  template_version:
    description: >-
      The template's version and format, for an encoding whose templates do not state them.
    range: fixp_object
    aliases: [Version]
    annotations:
      sbe_field_id: "20"
      repository_field_id: "21"
      repository_datatype: data

  template:
    description: The template itself, as octets.
    range: fixp_object
    aliases: [Template]
    annotations:
      sbe_field_id: "21"
      repository_field_id: "22"
      repository_datatype: data

classes:

  FixpMessage:
    abstract: true
    description: >-
      One FIXP message, as its fields would be read from the wire before or after encoding.
    comments:
      - >-
        The FIXP files define each message as an SBE message template, which lmodel/fix-sbe
        models as SbeMessageV1, and as an Orchestra message, which lmodel/fix-orchestra models
        as OrchestraMessageV10. A record of those classes defines a kind of message; an
        instance of this class is one message of that kind.
      - >-
        The annotations of each subclass name its template id and its name in the SBE schema,
        the stage the summary in section 6 gives it, which side sends it, and the flow types
        it may appear on.
    related_mappings:
      - fix_sbe:SbeMessageV1
      - fix_orchestra:OrchestraMessageV10
    slots:
      - message_kind
