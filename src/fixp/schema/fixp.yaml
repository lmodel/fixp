classes:
  FixpSessionExchange:
    description: Top-level container for a FIXP session exchange - holds an ordered list of session messages plus optional metadata.
    tree_root: true
    class_uri: fixp:FixpSessionExchange
    broad_mappings: [gist_linkml:Event]
    related_mappings: [common_domain_model:Workflow, fix_orchestra:MessageType, fix_sbe:MessageSchemaV1]
    attributes:
      messages:
        range: FixpSessionMessage
        multivalued: true
        inlined_as_list: true
        description: Ordered sequence of FIXP session messages.

      title:
        range: string
        slot_uri: dcterms:title
        description: Title of this exchange document.

      creator:
        range: string
        slot_uri: dcterms:creator
        description: Creator of this exchange document.

      publisher:
        range: string
        slot_uri: dcterms:publisher
        description: Publisher of this exchange document.

      rights:
        range: string
        slot_uri: dcterms:rights
        description: Rights statement for this exchange document.

      date:
        range: string
        slot_uri: dcterms:date
        description: Date associated with this exchange document.

  FixpSessionMessage:
    description: Abstract base class for every FIXP session message.
    abstract: true
    class_uri: fixp:FixpSessionMessage
    close_mappings: [common_domain_model:MessageInformation]
    broad_mappings:
      - common_domain_model:WorkflowStep
      - fix_orchestra:MessageType
      - fix_sbe:MessageV1
      - gist_linkml:Message
    in_subset: [fixp_session_messages]

  SbeObjectComposite:
    description: Variable length data, also know as octect string
    class_uri: fixp:SbeObjectComposite
    exact_mappings: [sbe:Object]
    close_mappings: [fix_sbe:CompositeDataTypeV1]
    in_subset: [sbe_types]
    attributes:
      length:
        range: integer
        description: SBE member 'length' (primitiveType=uint16, semanticType=Length).
        annotations:
          sbe_primitive_type: uint16
          sbe_semantic_type: Length

      var_data:
        range: integer
        description: SBE member 'varData' (primitiveType=uint8, semanticType=data).
        annotations:
          sbe_primitive_type: uint8
          sbe_member_name: varData
          sbe_length: '0'
          sbe_semantic_type: data

  SbeCharacterStringComposite:
    description: Variable length text
    class_uri: fixp:SbeCharacterStringComposite
    exact_mappings: [sbe:CharacterString]
    close_mappings: [fix_sbe:CompositeDataTypeV1]
    in_subset: [sbe_types]
    attributes:
      length:
        range: integer
        description: SBE member 'length' (primitiveType=uint16, semanticType=Length).
        annotations:
          sbe_primitive_type: uint16
          sbe_semantic_type: Length

      var_data:
        range: string
        description: SBE member 'varData' (primitiveType=char, semanticType=String).
        annotations:
          sbe_primitive_type: char
          sbe_member_name: varData
          sbe_length: '0'
          sbe_semantic_type: String

  SbeMessageHeaderComposite:
    description: Message identifiers and length of message root
    class_uri: fixp:SbeMessageHeaderComposite
    exact_mappings: [sbe:messageHeader]
    close_mappings: [fix_sbe:CompositeDataTypeV1]
    in_subset: [sbe_types]
    attributes:
      block_length:
        range: integer
        description: SBE member 'blockLength' (primitiveType=uint16).
        annotations:
          sbe_primitive_type: uint16
          sbe_member_name: blockLength

      template_id:
        range: integer
        description: SBE member 'templateId' (primitiveType=uint16).
        annotations:
          sbe_primitive_type: uint16
          sbe_member_name: templateId

      schema_id:
        range: integer
        description: SBE member 'schemaId' (primitiveType=uint16).
        annotations:
          sbe_primitive_type: uint16
          sbe_member_name: schemaId

      schema_version:
        range: integer
        description: SBE member 'version' (primitiveType=uint16).
        annotations:
          sbe_primitive_type: uint16
          sbe_member_name: version

