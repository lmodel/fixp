types:
  FIXInt:
    name: FIXInt
    definition_uri: https://w3id.org/lmodel/fixp/FIXInt
    annotations:
      proto_scalar: fixed32
      xsd_base: xs:integer
    description: 'FIX int base datatype. Sequence of digits without commas or decimals
      and optional sign character (ASCII characters "-" and "0" - "9" ). The sign
      character utilizes one byte (i.e. positive int is "99999" while negative int
      is "-99999"). Note that int values may contain leading zeros (e.g. "00023" =
      "23"). Example: 723 in field 21 would be mapped int as |21=723|. -723 in field
      12 would be mapped int as |12=-723|.'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:int
    - fix_orchestra:FIXInt
    typeof: integer
    base: int
    uri: fixp:FIXInt
  FIXLength:
    name: FIXLength
    definition_uri: https://w3id.org/lmodel/fixp/FIXLength
    annotations:
      proto_scalar: fixed32
      xsd_base: xs:nonNegativeInteger
    description: FIX Length datatype (extends int). int field representing the length
      in bytes. Value must be positive.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Length
    - fix_orchestra:FIXLength
    typeof: integer
    base: int
    uri: fixp:FIXLength
  FIXTagNum:
    name: FIXTagNum
    definition_uri: https://w3id.org/lmodel/fixp/FIXTagNum
    annotations:
      proto_scalar: fixed32
      xsd_base: xs:nonNegativeInteger
    description: FIX TagNum datatype (extends int). int field representing a field's
      tag number when using FIX "Tag=Value" syntax. Value must be positive and may
      not contain leading zeros.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:TagNum
    - fix_orchestra:FIXTagNum
    typeof: integer
    base: int
    uri: fixp:FIXTagNum
  FIXSeqNum:
    name: FIXSeqNum
    definition_uri: https://w3id.org/lmodel/fixp/FIXSeqNum
    annotations:
      proto_scalar: fixed32
      xsd_base: xs:positiveInteger
    description: FIX SeqNum datatype (extends int). int field representing a message
      sequence number. Value must be positive.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:SeqNum
    - fix_orchestra:FIXSeqNum
    typeof: integer
    base: int
    uri: fixp:FIXSeqNum
  FIXNumInGroup:
    name: FIXNumInGroup
    definition_uri: https://w3id.org/lmodel/fixp/FIXNumInGroup
    annotations:
      proto_scalar: fixed32
    description: FIX NumInGroup datatype (extends int). int field representing the
      number of entries in a repeating group. Value must be positive.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:NumInGroup
    - fix_orchestra:FIXNumInGroup
    typeof: string
    base: str
    uri: fixp:FIXNumInGroup
  FIXDayOfMonth:
    name: FIXDayOfMonth
    definition_uri: https://w3id.org/lmodel/fixp/FIXDayOfMonth
    annotations:
      proto_scalar: fixed32
    description: FIX DayOfMonth datatype (extends int). int field representing a day
      during a particular monthy (values 1 to 31).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:DayOfMonth
    - fix_orchestra:FIXDayOfMonth
    typeof: string
    base: str
    uri: fixp:FIXDayOfMonth
  FIXFloat:
    name: FIXFloat
    definition_uri: https://w3id.org/lmodel/fixp/FIXFloat
    annotations:
      proto_scalar: double
      xsd_base: xs:decimal
    description: FIX float base datatype. Sequence of digits with optional decimal
      point and sign character (ASCII characters "-", "0" - "9" and "."); the absence
      of the decimal point within the string will be interpreted as the float representation
      of an integer value. All float fields must accommodate up to fifteen significant
      digits. The number of decimal places used should be a factor of business/market
      needs and mutual agreement between counterparties. Note that float values may
      contain leading zeros (e.g. "00023.23" = "23.23") and may contain or omit trailing
      zeros after the decimal point (e.g. "23.0" = "23.0000" = "23" = "23."). Note
      that fields which are derived from float may contain negative values unless
      explicitly specified otherwise.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:float
    - fix_orchestra:FIXFloat
    typeof: float
    base: float
    uri: fixp:FIXFloat
  FIXQty:
    name: FIXQty
    definition_uri: https://w3id.org/lmodel/fixp/FIXQty
    annotations:
      proto_scalar: Decimal64
      xsd_base: xs:decimal
    description: FIX Qty datatype (extends float). float field capable of storing
      either a whole number (no decimal places) of "shares" (securities denominated
      in whole units) or a decimal value containing decimal places for non-share quantity
      asset classes (securities denominated in fractional units).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Qty
    - fix_orchestra:FIXQty
    typeof: float
    base: float
    uri: fixp:FIXQty
  FIXPrice:
    name: FIXPrice
    definition_uri: https://w3id.org/lmodel/fixp/FIXPrice
    annotations:
      proto_scalar: Decimal64
      xsd_base: xs:decimal
    description: 'FIX Price datatype (extends float). float field representing a price.
      Note the number of decimal places may vary. For certain asset classes prices
      may be negative values. For example, prices for options strategies can be negative
      under certain market conditions. Refer to Volume 7: FIX Usage by Product for
      asset classes that support negative price values. Example: Strk="47.50"'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Price
    - fix_orchestra:FIXPrice
    typeof: float
    base: float
    uri: fixp:FIXPrice
  FIXPriceOffset:
    name: FIXPriceOffset
    definition_uri: https://w3id.org/lmodel/fixp/FIXPriceOffset
    annotations:
      proto_scalar: Decimal64
      xsd_base: xs:decimal
    description: FIX PriceOffset datatype (extends float). float field representing
      a price offset, which can be mathematically added to a "Price". Note the number
      of decimal places may vary and some fields such as LastForwardPoints may be
      negative.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:PriceOffset
    - fix_orchestra:FIXPriceOffset
    typeof: float
    base: float
    uri: fixp:FIXPriceOffset
  FIXAmt:
    name: FIXAmt
    definition_uri: https://w3id.org/lmodel/fixp/FIXAmt
    annotations:
      proto_scalar: Decimal64
      xsd_base: xs:decimal
    description: 'FIX Amt datatype (extends float). float field typically representing
      a Price times a Qty Example: Amt="6847.00"'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Amt
    - fix_orchestra:FIXAmt
    typeof: float
    base: float
    uri: fixp:FIXAmt
  FIXPercentage:
    name: FIXPercentage
    definition_uri: https://w3id.org/lmodel/fixp/FIXPercentage
    annotations:
      proto_scalar: double
      xsd_base: xs:decimal
    description: FIX Percentage datatype (extends float). float field representing
      a percentage (e.g. 0.05 represents 5% and 0.9525 represents 95.25%). Note the
      number of decimal places may vary.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Percentage
    - fix_orchestra:FIXPercentage
    typeof: float
    base: float
    uri: fixp:FIXPercentage
  FIXChar:
    name: FIXChar
    definition_uri: https://w3id.org/lmodel/fixp/FIXChar
    annotations:
      proto_scalar: string
      xsd_base: xs:string
    description: FIX char base datatype. Single character value, can include any alphanumeric
      character or punctuation except the delimiter. All char fields are case sensitive
      (i.e. m != M).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:char
    - fix_orchestra:FIXChar
    typeof: string
    base: str
    uri: fixp:FIXChar
  FIXBoolean:
    name: FIXBoolean
    definition_uri: https://w3id.org/lmodel/fixp/FIXBoolean
    annotations:
      proto_scalar: bool
      xsd_base: xs:string
    description: 'FIX Boolean datatype (extends char). char field containing one of
      two values: ''Y'' = True/Yes ''N'' = False/No'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Boolean
    - fix_orchestra:FIXBoolean
    typeof: string
    base: str
    uri: fixp:FIXBoolean
    pattern: '[YN]{1}'
  FIXString:
    name: FIXString
    definition_uri: https://w3id.org/lmodel/fixp/FIXString
    annotations:
      proto_scalar: string
      xsd_base: xs:string
    description: FIX String base datatype. Alpha-numeric free format strings, can
      include any character or punctuation except the delimiter. All String fields
      are case sensitive (i.e. morstatt != Morstatt).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:String
    - fix_orchestra:FIXString
    typeof: string
    base: str
    uri: fixp:FIXString
  FIXMultipleCharValue:
    name: FIXMultipleCharValue
    definition_uri: https://w3id.org/lmodel/fixp/FIXMultipleCharValue
    annotations:
      proto_scalar: string
      xsd_base: xs:string
    description: FIX MultipleCharValue datatype (extends String). string field containing
      one or more space delimited single character values (e.g. |18=2 A F| ).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:MultipleCharValue
    - fix_orchestra:FIXMultipleCharValue
    typeof: string
    base: str
    uri: fixp:FIXMultipleCharValue
    pattern: '[A-Za-z0-9](\s[A-Za-z0-9])*'
  FIXMultipleStringValue:
    name: FIXMultipleStringValue
    definition_uri: https://w3id.org/lmodel/fixp/FIXMultipleStringValue
    annotations:
      proto_scalar: string
      xsd_base: xs:string
    description: FIX MultipleStringValue datatype (extends String). string field containing
      one or more space delimited multiple character values (e.g. |277=AV AN A| ).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:MultipleStringValue
    - fix_orchestra:FIXMultipleStringValue
    typeof: string
    base: str
    uri: fixp:FIXMultipleStringValue
    pattern: .+(\s.+)*
  FIXCountry:
    name: FIXCountry
    definition_uri: https://w3id.org/lmodel/fixp/FIXCountry
    annotations:
      proto_scalar: string
      xsd_base: xs:string
    description: FIX Country datatype (extends String). string field representing
      a country using ISO 3166 Country code (2 character) values (see Appendix 6-B).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Country
    - fix_orchestra:FIXCountry
    typeof: string
    base: str
    uri: fixp:FIXCountry
    pattern: .{2}
  FIXCurrency:
    name: FIXCurrency
    definition_uri: https://w3id.org/lmodel/fixp/FIXCurrency
    annotations:
      proto_scalar: string
      xsd_base: xs:string
    description: 'FIX Currency datatype (extends String). string field representing
      a currency type using ISO 4217 Currency code (3 character) values (see Appendix
      6-A). Example: StrkCcy="USD"'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Currency
    - fix_orchestra:FIXCurrency
    typeof: string
    base: str
    uri: fixp:FIXCurrency
    pattern: .{3}
  FIXExchange:
    name: FIXExchange
    definition_uri: https://w3id.org/lmodel/fixp/FIXExchange
    annotations:
      proto_scalar: string
      xsd_base: xs:string
    description: FIX Exchange datatype (extends String). string field representing
      a market or exchange using ISO 10383 Market Identifier Code (MIC) values (see"Appendix
      6-C).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Exchange
    - fix_orchestra:FIXExchange
    typeof: string
    base: str
    uri: fixp:FIXExchange
    pattern: .*
  FIXMonthYear:
    name: FIXMonthYear
    definition_uri: https://w3id.org/lmodel/fixp/FIXMonthYear
    annotations:
      proto_scalar: string
      xsd_base: xs:string
    description: 'FIX MonthYear datatype (extends String). string field representing
      month of a year. An optional day of the month can be appended or an optional
      week code. Valid formats: YYYYMM YYYYMMDD YYYYMMWW Valid values: YYYY = 0000-9999;
      MM = 01-12; DD = 01-31; WW = w1, w2, w3, w4, w5. Example: MonthYear="200303",
      MonthYear="20030320", MonthYear="200303w2"'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:MonthYear
    - fix_orchestra:FIXMonthYear
    typeof: string
    base: str
    uri: fixp:FIXMonthYear
    pattern: \d{4}(0|1)\d([0-3wW]\d)?
  FIXUTCTimestamp:
    name: FIXUTCTimestamp
    definition_uri: https://w3id.org/lmodel/fixp/FIXUTCTimestamp
    annotations:
      proto_scalar: Timestamp
      xsd_base: xs:dateTime
    description: 'FIX UTCTimestamp datatype (extends String). string field representing
      time/date combination represented in UTC (Universal Time Coordinated, also known
      as "GMT") in either YYYYMMDD-HH:MM:SS (whole seconds) or YYYYMMDD-HH:MM:SS.sss*
      format, colons, dash, and period required. Valid values: YYYY = 0000-9999, MM
      = 01-12, DD = 01-31, HH = 00-23, MM = 00-59, SS = 00-60 (60 only if UTC leap
      second), sss* fractions of seconds. The fractions of seconds may be empty when
      no fractions of seconds are conveyed (in such a case the period is not conveyed),
      it may include 3 digits to convey milliseconds, 6 digits to convey microseconds,
      9 digits to convey nanoseconds, 12 digits to convey picoseconds; Other number
      of digits may be used with bilateral agreement. Leap Seconds: Note that UTC
      includes corrections for leap seconds, which are inserted to account for slowing
      of the rotation of the earth. Leap second insertion is declared by the International
      Earth Rotation Service (IERS) and has, since 1972, only occurred on the night
      of Dec. 31 or Jun 30. The IERS considers March 31 and September 30 as secondary
      dates for leap second insertion, but has never utilized these dates. During
      a leap second insertion, a UTCTimestamp field may read "19981231-23:59:59",
      "19981231-23:59:60", "19990101-00:00:00". (see http://tycho.usno.navy.mil/leapsec.html)
      Example: TransactTime(60)="20011217-09:30:47.123" millisecond TransactTime(60)="20011217-09:30:47.123456"
      microseconds TransactTime(60)="20011217-09:30:47.123456789" nanoseconds TransactTime(60)="20011217-09:30:47.123456789123"
      picoseconds'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:UTCTimestamp
    - fix_orchestra:FIXUTCTimestamp
    typeof: datetime
    base: XSDDateTime
    uri: fixp:FIXUTCTimestamp
    repr: str
  FIXUTCTimeOnly:
    name: FIXUTCTimeOnly
    definition_uri: https://w3id.org/lmodel/fixp/FIXUTCTimeOnly
    annotations:
      proto_scalar: TimeOnly
      xsd_base: xs:time
    description: 'FIX UTCTimeOnly datatype (extends String). string field representing
      time-only represented in UTC (Universal Time Coordinated, also known as "GMT")
      in either HH:MM:SS (whole seconds) or HH:MM:SS.sss* (milliseconds) format, colons,
      and period required. This special-purpose field is paired with UTCDateOnly to
      form a proper UTCTimestamp for bandwidth-sensitive messages. Valid values: HH
      = 00-23, MM = 00-59, SS = 00-60 (60 only if UTC leap second), sss* fractions
      of seconds. The fractions of seconds may be empty when no fractions of seconds
      are conveyed (in such a case the period is not conveyed), it may include 3 digits
      to convey milliseconds, 6 digits to convey microseconds, 9 digits to convey
      nanoseconds, 12 digits to convey picoseconds; Other number of digits may be
      used with bilateral agreement. Example: MDEntryTime(273)="13:20:00.123"milliseconds
      MDEntryTime(273)="13:20:00.123456" microseconds MDEntryTime(273)="13:20:00.123456789"
      nanoseconds MDEntryTime(273)="13:20:00.123456789123" picoseconds'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:UTCTimeOnly
    - fix_orchestra:FIXUTCTimeOnly
    typeof: string
    base: str
    uri: fixp:FIXUTCTimeOnly
  FIXUTCDateOnly:
    name: FIXUTCDateOnly
    definition_uri: https://w3id.org/lmodel/fixp/FIXUTCDateOnly
    annotations:
      proto_scalar: string
      xsd_base: xs:date
    description: 'FIX UTCDateOnly datatype (extends String). string field representing
      Date represented in UTC (Universal Time Coordinated, also known as "GMT") in
      YYYYMMDD format. This special-purpose field is paired with UTCTimeOnly to form
      a proper UTCTimestamp for bandwidth-sensitive messages. Valid values: YYYY =
      0000-9999, MM = 01-12, DD = 01-31. Example: MDEntryDate="20030910"'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:UTCDateOnly
    - fix_orchestra:FIXUTCDateOnly
    typeof: date
    base: XSDDate
    uri: fixp:FIXUTCDateOnly
    repr: str
  FIXLocalMktDate:
    name: FIXLocalMktDate
    definition_uri: https://w3id.org/lmodel/fixp/FIXLocalMktDate
    annotations:
      proto_scalar: string
      xsd_base: xs:date
    description: 'FIX LocalMktDate datatype (extends String). string field representing
      a Date of Local Market (as opposed to UTC) in YYYYMMDD format. This is the "normal"
      date field used by the FIX Protocol. Valid values: YYYY = 0000-9999, MM = 01-12,
      DD = 01-31 Example: MaturityDate(541)="20150724"'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:LocalMktDate
    - fix_orchestra:FIXLocalMktDate
    typeof: date
    base: XSDDate
    uri: fixp:FIXLocalMktDate
    repr: str
  FIXTZTimeOnly:
    name: FIXTZTimeOnly
    definition_uri: https://w3id.org/lmodel/fixp/FIXTZTimeOnly
    annotations:
      proto_scalar: TimeOnly
      xsd_base: xs:time
    description: 'FIX TZTimeOnly datatype (extends String). string field representing
      the time represented based on ISO 8601. This is the time with a UTC offset to
      allow identification of local time and timezone of that time. Format is HH:MM[:SS][Z
      | [ + | - hh[:mm]]] where HH = 00-23 hours, MM = 00-59 minutes, SS = 00-59 seconds,
      hh = 01-12 offset hours, mm = 00-59 offset minutes. Example: "07:39Z" is 07:39
      UTC "02:39-05" is five hours behind UTC, thus Eastern Time "15:39+08" is eight
      hours ahead of UTC, Hong Kong/Singapore time "13:09+05:30" is 5.5 hours ahead
      of UTC, India time'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:TZTimeOnly
    - fix_orchestra:FIXTZTimeOnly
    typeof: string
    base: str
    uri: fixp:FIXTZTimeOnly
  FIXTZTimestamp:
    name: FIXTZTimestamp
    definition_uri: https://w3id.org/lmodel/fixp/FIXTZTimestamp
    annotations:
      proto_scalar: Timestamp
      xsd_base: xs:dateTime
    description: 'FIX TZTimestamp datatype (extends String). string field representing
      a time/date combination representing local time with an offset to UTC to allow
      identification of local time and timezone offset of that time. The representation
      is based on ISO 8601. Format is YYYYMMDD-HH:MM:SS.sss*[Z | [ + | - hh[:mm]]]
      where YYYY = 0000 to 9999, MM = 01-12, DD = 01-31 HH = 00-23 hours, MM = 00-59
      minutes, SS = 00-59 seconds, hh = 01-12 offset hours, mm = 00-59 offset minutes,
      sss* fractions of seconds. The fractions of seconds may be empty when no fractions
      of seconds are conveyed (in such a case the period is not conveyed), it may
      include 3 digits to convey milliseconds, 6 digits to convey microseconds, 9
      digits to convey nanoseconds, 12 digits to convey picoseconds; Other number
      of digits may be used with bilateral agreement Example: "20060901-07:39Z" is
      07:39 UTC on 1st of September 2006 "20060901-02:39-05" is five hours behind
      UTC, thus Eastern Time on 1st of September 2006 "20060901-15:39+08" is eight
      hours ahead of UTC, Hong Kong/Singapore time on 1st of September 2006 "20060901-13:09+05:30"
      is 5.5 hours ahead of UTC, India time on 1st of September 2006 Using decimal
      seconds: "20060901-13:09.123+05:30" milliseconds "20060901-13:09.123456+05:30"
      microseconds "20060901-13:09.123456789+05:30" nanoseconds "20060901-13:09.123456789123+05:30"
      picoseconds "20060901-13:09.123456789Z" nanoseconds UTC timezone'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:TZTimestamp
    - fix_orchestra:FIXTZTimestamp
    typeof: datetime
    base: XSDDateTime
    uri: fixp:FIXTZTimestamp
    repr: str
  FIXData:
    name: FIXData
    definition_uri: https://w3id.org/lmodel/fixp/FIXData
    annotations:
      proto_scalar: bytes
      xsd_base: xs:base64Binary
    description: 'FIX data datatype (extends String). string field containing raw
      data with no format or content restrictions. Data fields are always immediately
      preceded by a length field. The length field should specify the number of bytes
      of the value of the data field (up to but not including the terminating SOH).
      Caution: the value of one of these fields may contain the delimiter (SOH) character.
      Note that the value specified for this field should be followed by the delimiter
      (SOH) character as all fields are terminated with an "SOH".'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:data
    - fix_orchestra:FIXData
    typeof: string
    base: str
    uri: fixp:FIXData
  FIXPattern:
    name: FIXPattern
    definition_uri: https://w3id.org/lmodel/fixp/FIXPattern
    annotations:
      proto_scalar: string
    description: FIX Pattern base datatype. Used to build on and provide some restrictions
      on what is allowed as valid values in fields that uses a base FIX data type
      and a pattern data type. The universe of allowable valid values for the field
      would then be the union of the base set of valid values and what is defined
      by the pattern data type. The pattern data type used by the field will retain
      its base FIX data type (e.g. String, int, char).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Pattern
    - fix_orchestra:FIXPattern
    typeof: string
    base: str
    uri: fixp:FIXPattern
  FIXTenor:
    name: FIXTenor
    definition_uri: https://w3id.org/lmodel/fixp/FIXTenor
    annotations:
      proto_scalar: Tenor
      xsd_base: xs:string
    description: 'FIX Tenor datatype (extends Pattern). used to allow the expression
      of FX standard tenors in addition to the base valid enumerations defined for
      the field that uses this pattern data type. This pattern data type is defined
      as follows: Dx = tenor expression for "days", e.g. "D5", where "x" is any integer
      > 0 Mx = tenor expression for "months", e.g. "M3", where "x" is any integer
      > 0 Wx = tenor expression for "weeks", e.g. "W13", where "x" is any integer
      > 0 Yx = tenor expression for "years", e.g. "Y1", where "x" is any integer >
      0'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:Tenor
    - fix_orchestra:FIXTenor
    typeof: string
    base: str
    uri: fixp:FIXTenor
    pattern: '[DMWY](\d)+'
  FIXReserved100Plus:
    name: FIXReserved100Plus
    definition_uri: https://w3id.org/lmodel/fixp/FIXReserved100Plus
    annotations:
      proto_scalar: fixed32
      xsd_base: xs:integer
      xsd_min_inclusive: '100'
    description: FIX Reserved100Plus datatype (extends Pattern). Values "100" and
      above are reserved for bilaterally agreed upon user defined enumerations.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
