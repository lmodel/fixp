    - fixpSessionExchange__title
    - fixpSessionExchange__creator
    - fixpSessionExchange__publisher
    - fixpSessionExchange__rights
    - fixpSessionExchange__date
    attributes:
      messages:
        name: messages
        description: Ordered sequence of FIXP session messages.
        range: FixpSessionMessage
        multivalued: true
        inlined_as_list: true
      title:
        name: title
        description: Title of this exchange document.
        slot_uri: dcterms:title
        range: string
      creator:
        name: creator
        description: Creator of this exchange document.
        slot_uri: dcterms:creator
        range: string
      publisher:
        name: publisher
        description: Publisher of this exchange document.
        slot_uri: dcterms:publisher
        range: string
      rights:
        name: rights
        description: Rights statement for this exchange document.
        slot_uri: dcterms:rights
        range: string
      date:
        name: date
        description: Date associated with this exchange document.
        slot_uri: dcterms:date
        range: string
