      proto_scalar: string
      xsd_base: xs:language
    description: 'FIX Language datatype (extends String). Identifier for a national
      language - uses ISO 639-1 standard Example: en (English), es (spanish), etc.'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
