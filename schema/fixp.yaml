  FixpSessionExchange:
    name: FixpSessionExchange
    definition_uri: https://w3id.org/lmodel/fixp/FixpSessionExchange
    description: Top-level container for a FIXP session exchange - holds an ordered
      list of session messages plus optional metadata.
    from_schema: https://w3id.org/lmodel/fixp
    mappings:
    - fixp:FixpSessionExchange
    related_mappings:
    - common_domain_model:Workflow
    - fix_orchestra:MessageType
    - fix_sbe:MessageSchemaV1
    broad_mappings:
    - gist_linkml:Event
    slots:
