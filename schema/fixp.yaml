  FIXLocalMktTime:
    name: FIXLocalMktTime
    definition_uri: https://w3id.org/lmodel/fixp/FIXLocalMktTime
    annotations:
      proto_scalar: TimeOnly
      xsd_base: xs:time
    description: 'FIX LocalMktTime datatype (extends String). string field representing
      the time local to a particular market center. Used where offset to UTC varies
      throughout the year and the defining market center is identified in a corresponding
      field. Format is HH:MM:SS where HH = 00-23 hours, MM = 00-59 minutes, SS = 00-59
      seconds. In general only the hour token is non-zero. Example: Example: 07:00:00'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:LocalMktTime
    - fix_orchestra:FIXLocalMktTime
    typeof: string
    base: str
    uri: fixp:FIXLocalMktTime
  FIXXID:
    name: FIXXID
    definition_uri: https://w3id.org/lmodel/fixp/FIXXID
    annotations:
      proto_scalar: string
      xsd_base: xs:ID
    description: FIX XID datatype (extends String). The purpose of the XID datatype
      is to define a unique identifier that is global to a FIX message. An identifier
      defined using this datatype uniquely identifies its containing element, whatever
      its type and name is. The constraint added by this datatype is that the values
      of all the fields that have an ID datatype in a FIX message must be unique.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
    - fixr:XID
    - fix_orchestra:FIXXID
    typeof: string
    base: str
    uri: fixp:FIXXID
  FIXXIDREF:
    name: FIXXIDREF
    definition_uri: https://w3id.org/lmodel/fixp/FIXXIDREF
    annotations:
      proto_scalar: string
      xsd_base: xs:IDREF
    description: FIX XIDREF datatype (extends String). The XIDREF datatype defines
      a reference to an identifier defined by the XID datatype.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fixp
    exact_mappings:
