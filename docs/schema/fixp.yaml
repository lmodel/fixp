classes:
  FixpMessage:
    name: FixpMessage
    definition_uri: https://w3id.org/lmodel/fixp/FixpMessage
    description: One FIXP message, as its fields would be read from the wire before
      or after encoding.
    comments:
    - The FIXP files define each message as an SBE message template, which lmodel/fix-sbe
      models as SbeMessageV1, and as an Orchestra message, which lmodel/fix-orchestra
      models as OrchestraMessageV10. A record of those classes defines a kind of message;
      an instance of this class is one message of that kind.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    related_mappings:
    - fix_sbe:SbeMessageV1
    - fix_orchestra:OrchestraMessageV10
    abstract: true
    slots:
    - message_kind
    class_uri: fixp:FixpMessage
  FixpNegotiate:
    name: FixpNegotiate
    definition_uri: https://w3id.org/lmodel/fixp/FixpNegotiate
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '1'
      sbe_name:
        tag: sbe_name
        value: Negotiate
      fixp_sent_by:
        tag: fixp_sent_by
        value: client
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
    description: A client's request to create a session under an identifier it has
      never used, stating the flow type it will send.
    in_subset:
    - fixp_initialization
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpNegotiate_session_id
    - FixpNegotiate_request_time
    - FixpNegotiate_client_flow
    - FixpNegotiate_credentials
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_time:
        name: request_time
        required: true
      client_flow:
        name: client_flow
        required: true
      credentials:
        name: credentials
        description: Data that identifies the client, in a form the two parties agree
          on.
    class_uri: fixp:FixpNegotiate
  FixpNegotiationResponse:
    name: FixpNegotiationResponse
    definition_uri: https://w3id.org/lmodel/fixp/FixpNegotiationResponse
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '2'
      sbe_name:
        tag: sbe_name
        value: NegotiationResponse
      fixp_sent_by:
        tag: fixp_sent_by
        value: server
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
    description: A server's acceptance of a new session, stating the flow type it
      will send back.
    in_subset:
    - fixp_initialization
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpNegotiationResponse_session_id
    - FixpNegotiationResponse_request_timestamp
    - FixpNegotiationResponse_server_flow
    - FixpNegotiationResponse_credentials
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_timestamp:
        name: request_timestamp
        description: The request_time of the Negotiate this message accepts.
        required: true
      server_flow:
        name: server_flow
        required: true
      credentials:
        name: credentials
        description: Data that identifies the server to the client, for mutual authentication.
    class_uri: fixp:FixpNegotiationResponse
  FixpNegotiationReject:
    name: FixpNegotiationReject
    definition_uri: https://w3id.org/lmodel/fixp/FixpNegotiationReject
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '3'
      sbe_name:
        tag: sbe_name
        value: NegotiationReject
      fixp_sent_by:
        tag: fixp_sent_by
        value: server
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
    description: A server's refusal to create a session. The server sends nothing
      more and closes the transport.
    in_subset:
    - fixp_initialization
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpNegotiationReject_session_id
    - FixpNegotiationReject_request_timestamp
    - FixpNegotiationReject_negotiation_reject_code
    - reason_text
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_timestamp:
        name: request_timestamp
        description: The request_time of the Negotiate this message refuses.
        required: true
      negotiation_reject_code:
        name: negotiation_reject_code
        required: true
    class_uri: fixp:FixpNegotiationReject
  FixpTopic:
    name: FixpTopic
    definition_uri: https://w3id.org/lmodel/fixp/FixpTopic
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '4'
      sbe_name:
        tag: sbe_name
        value: Topic
      fixp_sent_by:
        tag: fixp_sent_by
        value: publisher
      fixp_multicast:
        tag: fixp_multicast
        value: 'true'
    description: A multicast publisher's notice that starts a flow and ties the session's
      short-lived identifier to a lasting subject. It is repeated so that late listeners
      can join.
    in_subset:
    - fixp_initialization
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpTopic_session_id
    - FixpTopic_flow
    - FixpTopic_keepalive_interval
    - FixpTopic_topic_classification
    slot_usage:
      session_id:
        name: session_id
        required: true
      flow:
        name: flow
        required: true
      keepalive_interval:
        name: keepalive_interval
        description: The publisher's heartbeat interval, in milliseconds.
        comments:
        - The SBE schema and the repository file give Topic this field, as a required
          one. Section 5's table leaves it out, so the schema accepts a Topic with
          or without it.
      topic_classification:
        name: topic_classification
        required: true
    class_uri: fixp:FixpTopic
  FixpEstablish:
    name: FixpEstablish
    definition_uri: https://w3id.org/lmodel/fixp/FixpEstablish
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '5'
      sbe_name:
        tag: sbe_name
        value: Establish
      fixp_sent_by:
        tag: fixp_sent_by
        value: client
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
    description: A client's request to tie a negotiated session to the very transport
      this message arrives on. After a disconnection it is sent again to re-bind.
    in_subset:
    - fixp_binding
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpEstablish_session_id
    - FixpEstablish_request_time
    - FixpEstablish_keepalive_interval
    - FixpEstablish_next_seq_no
    - FixpEstablish_credentials
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_time:
        name: request_time
        required: true
      keepalive_interval:
        name: keepalive_interval
        description: The longest the client stays silent, in milliseconds, before
          a heartbeat.
        required: true
      next_seq_no:
        name: next_seq_no
        description: When the client's recoverable flow is bound again, the number
          its next application message will carry.
      credentials:
        name: credentials
        description: Data that identifies the client, in a form the two parties agree
          on.
    class_uri: fixp:FixpEstablish
  FixpEstablishmentAck:
    name: FixpEstablishmentAck
    definition_uri: https://w3id.org/lmodel/fixp/FixpEstablishmentAck
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '6'
      sbe_name:
        tag: sbe_name
        value: EstablishmentAck
      fixp_sent_by:
        tag: fixp_sent_by
        value: server
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
    description: A server's acceptance of the binding. From here, application messages
      may flow.
    in_subset:
    - fixp_binding
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpEstablishmentAck_session_id
    - FixpEstablishmentAck_request_timestamp
    - FixpEstablishmentAck_keepalive_interval
    - FixpEstablishmentAck_next_seq_no
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_timestamp:
        name: request_timestamp
        description: The request_time of the Establish this message accepts.
        required: true
      keepalive_interval:
        name: keepalive_interval
        description: The longest the server stays silent, in milliseconds, before
          a heartbeat.
        required: true
      next_seq_no:
        name: next_seq_no
        description: If the server's flow is recoverable, the number its next application
          message will carry, so the client can ask for what it missed.
    class_uri: fixp:FixpEstablishmentAck
  FixpEstablishmentReject:
    name: FixpEstablishmentReject
    definition_uri: https://w3id.org/lmodel/fixp/FixpEstablishmentReject
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '7'
      sbe_name:
        tag: sbe_name
        value: EstablishmentReject
      fixp_sent_by:
        tag: fixp_sent_by
        value: server
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
    description: A server's refusal of the binding.
    in_subset:
    - fixp_binding
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpEstablishmentReject_session_id
    - FixpEstablishmentReject_request_timestamp
    - FixpEstablishmentReject_establishment_reject_code
    - reason_text
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_timestamp:
        name: request_timestamp
        description: The request_time of the Establish this message refuses.
        required: true
      establishment_reject_code:
        name: establishment_reject_code
        required: true
    class_uri: fixp:FixpEstablishmentReject
  FixpSequence:
    name: FixpSequence
    definition_uri: https://w3id.org/lmodel/fixp/FixpSequence
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '8'
      sbe_name:
        tag: sbe_name
        value: Sequence
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent
      fixp_multicast:
        tag: fixp_multicast
        value: 'true'
      fixp_flow_of:
        tag: fixp_flow_of
        value: own
    description: Starts the numbering of a sequenced flow, so that the application
      messages after it are numbered by counting up from the value it carries. Sent
      when idle, it is also the heartbeat.
    comments:
    - It is used on a transport that carries one session; Context replaces it on a
      shared one.
    in_subset:
    - fixp_transferring
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpSequence_next_seq_no
    slot_usage:
      next_seq_no:
        name: next_seq_no
        required: true
    class_uri: fixp:FixpSequence
  FixpContext:
    name: FixpContext
    definition_uri: https://w3id.org/lmodel/fixp/FixpContext
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '9'
      sbe_name:
        tag: sbe_name
        value: Context
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'true'
      fixp_flow_of:
        tag: fixp_flow_of
        value: own
    description: On a transport that several sessions share, names the session the
      following messages belong to and, when the flow is sequenced, where its numbering
      continues.
    in_subset:
    - fixp_transferring
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpContext_session_id
    - FixpContext_next_seq_no
    slot_usage:
      session_id:
        name: session_id
        required: true
      next_seq_no:
        name: next_seq_no
        comments:
        - Section 3's table makes it optional, and both resource files make it required,
          so the schema accepts a Context with or without it.
    class_uri: fixp:FixpContext
  FixpUnsequencedHeartbeat:
    name: FixpUnsequencedHeartbeat
    definition_uri: https://w3id.org/lmodel/fixp/FixpUnsequencedHeartbeat
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '10'
      sbe_name:
        tag: sbe_name
        value: UnsequencedHeartbeat
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
      fixp_flow_of:
        tag: fixp_flow_of
        value: own
    description: Shows the peer that the session and transport are alive when the
      sender's flow is unsequenced or empty. It has no fields.
    in_subset:
    - fixp_transferring
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    class_uri: fixp:FixpUnsequencedHeartbeat
  FixpRetransmitRequest:
    name: FixpRetransmitRequest
    definition_uri: https://w3id.org/lmodel/fixp/FixpRetransmitRequest
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '11'
      sbe_name:
        tag: sbe_name
        value: RetransmitRequest
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
      fixp_flow_of:
        tag: fixp_flow_of
        value: peer
    description: Asks the peer to resend some messages of its recoverable flow. A
      party has at most one such request open at a time.
    in_subset:
    - fixp_transferring
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpRetransmitRequest_session_id
    - FixpRetransmitRequest_request_time
    - FixpRetransmitRequest_from_seq_no
    - FixpRetransmitRequest_message_count
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_time:
        name: request_time
        description: When the request was made, which also tells this request apart
          from others.
        required: true
      from_seq_no:
        name: from_seq_no
        description: Where the requested run starts, by sequence number.
        required: true
      message_count:
        name: message_count
        description: How many messages are asked for.
        required: true
    class_uri: fixp:FixpRetransmitRequest
  FixpRetransmission:
    name: FixpRetransmission
    definition_uri: https://w3id.org/lmodel/fixp/FixpRetransmission
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '12'
      sbe_name:
        tag: sbe_name
        value: Retransmission
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
      fixp_flow_of:
        tag: fixp_flow_of
        value: own
    description: Introduces a batch of resent messages, which are numbered by counting
      from the number it gives. A request may be answered in several batches.
    in_subset:
    - fixp_transferring
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpRetransmission_session_id
    - FixpRetransmission_request_timestamp
    - FixpRetransmission_next_seq_no
    - FixpRetransmission_message_count
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_timestamp:
        name: request_timestamp
        description: The request_time of the RetransmitRequest this batch answers.
        required: true
      next_seq_no:
        name: next_seq_no
        description: The number the batch's first message carries.
        required: true
      message_count:
        name: message_count
        description: How many resent messages the batch holds.
        required: true
    class_uri: fixp:FixpRetransmission
  FixpRetransmitReject:
    name: FixpRetransmitReject
    definition_uri: https://w3id.org/lmodel/fixp/FixpRetransmitReject
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '13'
      sbe_name:
        tag: sbe_name
        value: RestransmitReject
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
      fixp_flow_of:
        tag: fixp_flow_of
        value: own
    description: Refuses a RetransmitRequest, with a code saying why.
    comments:
    - The resource files and section 4's table spell its name RestransmitReject. The
      summary in section 6 does not list it; it answers a RetransmitRequest, so it
      belongs to recoverable flows.
    in_subset:
    - fixp_transferring
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpRetransmitReject_session_id
    - FixpRetransmitReject_request_timestamp
    - FixpRetransmitReject_retransmit_reject_code
    - reason_text
    slot_usage:
      session_id:
        name: session_id
        required: true
      request_timestamp:
        name: request_timestamp
        description: The request_time of the RetransmitRequest this message refuses.
        required: true
      retransmit_reject_code:
        name: retransmit_reject_code
        required: true
    class_uri: fixp:FixpRetransmitReject
  FixpTerminate:
    name: FixpTerminate
    definition_uri: https://w3id.org/lmodel/fixp/FixpTerminate
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '14'
      sbe_name:
        tag: sbe_name
        value: Terminate
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
    description: Releases the session from its transport without ending the session,
      which can be bound again later. The peer answers with a Terminate, and after
      its own Terminate a party sends nothing more.
    in_subset:
    - fixp_unbinding
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpTerminate_session_id
    - FixpTerminate_termination_code
    - reason_text
    slot_usage:
      session_id:
        name: session_id
        required: true
      termination_code:
        name: termination_code
        required: true
    class_uri: fixp:FixpTerminate
  FixpFinishedSending:
    name: FixpFinishedSending
    definition_uri: https://w3id.org/lmodel/fixp/FixpFinishedSending
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '15'
      sbe_name:
        tag: sbe_name
        value: FinishedSending
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'true'
      fixp_flow_of:
        tag: fixp_flow_of
        value: own
    description: Says that the sender's flow has carried its last application message,
      which begins finalization. It is repeated as the heartbeat until the answer
      comes.
    in_subset:
    - fixp_finalizing
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpFinishedSending_session_id
    - FixpFinishedSending_last_seq_no
    slot_usage:
      session_id:
        name: session_id
        required: true
      last_seq_no:
        name: last_seq_no
        comments:
        - Optional in section 4's table and in the SBE schema, required in the repository
          file. Section 4 asks for it whenever the flow is recoverable or idempotent,
          which tests/fixp_rules.py checks in an exchange.
    class_uri: fixp:FixpFinishedSending
  FixpFinishedReceiving:
    name: FixpFinishedReceiving
    definition_uri: https://w3id.org/lmodel/fixp/FixpFinishedReceiving
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '16'
      sbe_name:
        tag: sbe_name
        value: FinishedReceiving
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'true'
      fixp_flow_of:
        tag: fixp_flow_of
        value: peer
    description: Answers FinishedSending once the last message of the peer's flow
      has been processed. After it the session is finalized and its identifier is
      spent.
    in_subset:
    - fixp_finalizing
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpFinishedReceiving_session_id
    slot_usage:
      session_id:
        name: session_id
        required: true
    class_uri: fixp:FixpFinishedReceiving
  FixpApplied:
    name: FixpApplied
    definition_uri: https://w3id.org/lmodel/fixp/FixpApplied
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '17'
      sbe_name:
        tag: sbe_name
        value: Applied
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Idempotent
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
      fixp_flow_of:
        tag: fixp_flow_of
        value: peer
    description: An optional application message telling the party that sends an idempotent
      flow which of its operations took effect, where no business message already
      says so.
    comments:
    - Like any application message, it uses up one number in the sequence of the flow
      it travels on.
    in_subset:
    - fixp_transferring
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpApplied_from_seq_no
    - FixpApplied_message_count
    slot_usage:
      from_seq_no:
        name: from_seq_no
        description: Where the run of operations that took effect starts.
        required: true
      message_count:
        name: message_count
        description: How many operations in a row took effect.
        required: true
    class_uri: fixp:FixpApplied
  FixpNotApplied:
    name: FixpNotApplied
    definition_uri: https://w3id.org/lmodel/fixp/FixpNotApplied
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '18'
      sbe_name:
        tag: sbe_name
        value: NotApplied
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Idempotent
      fixp_multicast:
        tag: fixp_multicast
        value: 'false'
      fixp_flow_of:
        tag: fixp_flow_of
        value: peer
    description: 'An application message telling the party that sends an idempotent
      flow about a gap: a run of operations that did not take effect. That party''s
      application decides what to do.'
    comments:
    - Like any application message, it uses up one number in the sequence of the flow
      it travels on.
    in_subset:
    - fixp_transferring
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpNotApplied_from_seq_no
    - FixpNotApplied_message_count
    slot_usage:
      from_seq_no:
        name: from_seq_no
        description: Where the run of operations that failed to take effect starts.
        required: true
      message_count:
        name: message_count
        description: How many operations in a row did not take effect.
        required: true
    class_uri: fixp:FixpNotApplied
  FixpMessageTemplate:
    name: FixpMessageTemplate
    definition_uri: https://w3id.org/lmodel/fixp/FixpMessageTemplate
    annotations:
      sbe_template_id:
        tag: sbe_template_id
        value: '19'
      sbe_name:
        tag: sbe_name
        value: MessageTemplate
      fixp_sent_by:
        tag: fixp_sent_by
        value: any
      fixp_flow_types:
        tag: fixp_flow_types
        value: Recoverable Idempotent Unsequenced None
      fixp_multicast:
        tag: fixp_multicast
        value: 'true'
    description: Hands the peer a template or schema it needs to read messages in
      an encoding that templates drive. There is no fixed moment for sending it.
    comments:
    - A publisher does well to repeat it for late listeners. On a shared transport
      it applies to every session there.
    in_subset:
    - fixp_initialization
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_messages
    is_a: FixpMessage
    slots:
    - message_kind
    - FixpMessageTemplate_sofh_encoding_type
    - effective_time
    - template_version
    - FixpMessageTemplate_template
    slot_usage:
      sofh_encoding_type:
        name: sofh_encoding_type
        required: true
      template:
        name: template
        required: true
    class_uri: fixp:FixpMessageTemplate
  FixpExchange:
    name: FixpExchange
    definition_uri: https://w3id.org/lmodel/fixp/FixpExchange
    description: The messages of one session in the order they were sent, as a test
      case, a worked example or a captured log.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_exchange
    slots:
    - id
    - description
    - fixpExchange__session_kind
    - fixpExchange__multiplexed
    - fixpExchange__exchange_steps
    attributes:
      session_kind:
        name: session_kind
        description: Which of the two forms the session takes.
        range: FixpSessionKind
        required: true
      multiplexed:
        name: multiplexed
        description: Whether the transport carries other sessions too, so that Context
          takes the place of Sequence.
        range: boolean
      exchange_steps:
        name: exchange_steps
        description: Each step of the exchange, in order.
        range: FixpExchangeStep
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: fixp:FixpExchange
    tree_root: true
  FixpExchangeStep:
    name: FixpExchangeStep
    definition_uri: https://w3id.org/lmodel/fixp/FixpExchangeStep
    description: 'One step: a FIXP message, or a run of application messages whose
      content FIXP does not define, and the side that sent it.'
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_exchange
    slots:
    - fixpExchangeStep__sent_by
    - fixpExchangeStep__fixp_message
    - fixpExchangeStep__application_message_count
    attributes:
      sent_by:
        name: sent_by
        description: The side that sent this step.
        range: FixpParty
        required: true
      fixp_message:
        name: fixp_message
        description: The FIXP message sent.
        range: FixpMessage
        inlined: true
      application_message_count:
        name: application_message_count
        description: How many application messages went out one after another. On
          a sequenced flow each takes the next sequence number.
        range: fixp_u32
        minimum_value: 1
    class_uri: fixp:FixpExchangeStep
    exactly_one_of:
    - slot_conditions:
        fixp_message:
          name: fixp_message
          value_presence: PRESENT
    - slot_conditions:
        application_message_count:
          name: application_message_count
          value_presence: PRESENT
  FixpRulesOfEngagement:
    name: FixpRulesOfEngagement
    definition_uri: https://w3id.org/lmodel/fixp/FixpRulesOfEngagement
    description: What two counterparties agree on for one FIXP service, layer by layer,
      for the client and for the server.
    comments:
    - Appendix B calls its checklist an aid, and FIXP leaves each of these choices
      to the counterparties.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_engagement
    slots:
    - id
    - description
    - fixpRulesOfEngagement__client_stack
    - fixpRulesOfEngagement__server_stack
    attributes:
      client_stack:
        name: client_stack
        description: What the client side uses.
        range: FixpStackProfile
        required: true
        inlined: true
      server_stack:
        name: server_stack
        description: What the server side uses.
        range: FixpStackProfile
        required: true
        inlined: true
    class_uri: fixp:FixpRulesOfEngagement
  FixpStackProfile:
    name: FixpStackProfile
    definition_uri: https://w3id.org/lmodel/fixp/FixpStackProfile
    description: 'One side''s choices at each layer of the stack: application, presentation,
      session, security and transport.'
    comments:
    - 'Beyond appendix B''s rows, it holds what sections 3 and 4 leave to the two
      parties: the form of the credentials, the keep-alive intervals each side accepts,
      and the most messages one resend may cover.'
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_engagement
    slots:
    - fixpStackProfile__application_recovery
    - fixpStackProfile__application_fix_version
    - fixpStackProfile__service_pack
    - fixpStackProfile__extension_packs
    - fixpStackProfile__message_encoding
    - fixpStackProfile__encoding_version
    - fixpStackProfile__message_schemas
    - fixpStackProfile__framing
    - fixpStackProfile__supported_flow_types
    - fixpStackProfile__shortest_keepalive_interval
    - fixpStackProfile__longest_keepalive_interval
    - fixpStackProfile__retransmission_limit
    - fixpStackProfile__tls_version
    - fixpStackProfile__authentication_methods
    - fixpStackProfile__credentials_format
    - fixpStackProfile__cipher_suites
    - fixpStackProfile__transports
    - fixpStackProfile__network_protocols
    attributes:
      application_recovery:
        name: application_recovery
        annotations:
          stack_layer:
            tag: stack_layer
            value: application
        description: Whether this side's applications recover lost messages themselves.
        range: boolean
      application_fix_version:
        name: application_fix_version
        annotations:
          stack_layer:
            tag: stack_layer
            value: application
        description: The FIX version of the application messages, such as FIX.Latest.
      service_pack:
        name: service_pack
        annotations:
          stack_layer:
            tag: stack_layer
            value: application
        description: The FIX service pack, where the version has them.
      extension_packs:
        name: extension_packs
        annotations:
          stack_layer:
            tag: stack_layer
            value: application
        description: The FIX extension packs in use.
        multivalued: true
      message_encoding:
        name: message_encoding
        annotations:
          stack_layer:
            tag: stack_layer
            value: presentation
        description: How messages are encoded, such as Simple Binary Encoding.
      encoding_version:
        name: encoding_version
        annotations:
          stack_layer:
            tag: stack_layer
            value: presentation
        description: The version of that encoding.
      message_schemas:
        name: message_schemas
        annotations:
          stack_layer:
            tag: stack_layer
            value: presentation
        description: The message schemas or templates the encoding uses.
        multivalued: true
      framing:
        name: framing
        annotations:
          stack_layer:
            tag: stack_layer
            value: presentation
        description: What marks where one message ends and the next begins, such as
          the Simple Open Framing Header.
      supported_flow_types:
        name: supported_flow_types
        annotations:
          stack_layer:
            tag: stack_layer
            value: session
        description: The flow types this side accepts or offers.
        range: FixpFlowType
        multivalued: true
      shortest_keepalive_interval:
        name: shortest_keepalive_interval
        annotations:
          stack_layer:
            tag: stack_layer
            value: session
          fixp_section:
            tag: fixp_section
            value: '4'
        description: The shortest keep-alive interval, in milliseconds, that this
          side accepts from its peer.
        comments:
        - An Establish that asks for a shorter one is refused with the KeepaliveInterval
          code.
        range: fixp_delta_millisecs
      longest_keepalive_interval:
        name: longest_keepalive_interval
        annotations:
          stack_layer:
            tag: stack_layer
            value: session
          fixp_section:
            tag: fixp_section
            value: '4'
        description: The longest keep-alive interval, in milliseconds, that this side
          accepts from its peer.
        comments:
        - An Establish that asks for a longer one is refused with the KeepaliveInterval
          code.
        range: fixp_delta_millisecs
      retransmission_limit:
        name: retransmission_limit
        annotations:
          stack_layer:
            tag: stack_layer
            value: session
          fixp_section:
            tag: fixp_section
            value: '4'
        description: The most messages this side resends in answer to one RetransmitRequest.
        comments:
        - A request for more may be refused with the RequestLimitExceeded code.
        range: fixp_u32
        minimum_value: 1
      tls_version:
        name: tls_version
        annotations:
          stack_layer:
            tag: stack_layer
            value: security
        description: The TLS version that protects the transport.
      authentication_methods:
        name: authentication_methods
        annotations:
          stack_layer:
            tag: stack_layer
            value: security
        description: How the parties prove who they are.
        multivalued: true
      credentials_format:
        name: credentials_format
        annotations:
          stack_layer:
            tag: stack_layer
            value: security
          fixp_section:
            tag: fixp_section
            value: '3'
        description: The form of the credentials this side sends, and how its peer
          checks them.
        comments:
        - FIXP carries credentials as opaque octets and leaves their form to the two
          parties.
      cipher_suites:
        name: cipher_suites
        annotations:
          stack_layer:
            tag: stack_layer
            value: security
        description: The cipher suites allowed.
        multivalued: true
      transports:
        name: transports
        annotations:
          stack_layer:
            tag: stack_layer
            value: transport
        description: The transports this side can use, for example TCP, or UDP with
          multicast.
        multivalued: true
      network_protocols:
        name: network_protocols
        annotations:
          stack_layer:
            tag: stack_layer
            value: transport
        description: Any other network protocols in use.
        multivalued: true
    class_uri: fixp:FixpStackProfile
