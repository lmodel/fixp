    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    typeof: integer
    base: int
    uri: xsd:integer
    minimum_value: 0
    maximum_value: 255
  fixp_u16:
    name: fixp_u16
    definition_uri: https://w3id.org/lmodel/fixp/FixpU16
    description: A whole number from 0 to 65,535, held in 16 unsigned bits.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    typeof: integer
    base: int
    uri: xsd:integer
    minimum_value: 0
    maximum_value: 65535
  fixp_u32:
    name: fixp_u32
    definition_uri: https://w3id.org/lmodel/fixp/FixpU32
    annotations:
      sbe_type:
        tag: sbe_type
        value: cardinal
      sbe_primitive_type:
        tag: sbe_primitive_type
        value: uint32
    description: A whole number from 0 to 4,294,967,295, held in 32 unsigned bits.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    typeof: integer
    base: int
    uri: xsd:integer
    minimum_value: 0
    maximum_value: 4294967295
  fixp_u64:
    name: fixp_u64
    definition_uri: https://w3id.org/lmodel/fixp/FixpU64
    annotations:
      sbe_type:
        tag: sbe_type
        value: ordinal
      sbe_primitive_type:
        tag: sbe_primitive_type
        value: uint64
    description: A whole number from 0 to 18,446,744,073,709,551,615, held in 64 unsigned
      bits.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    typeof: integer
    base: int
    uri: xsd:integer
    minimum_value: 0
    maximum_value: 18446744073709551615
  fixp_uuid:
    name: fixp_uuid
    definition_uri: https://w3id.org/lmodel/fixp/FixpUuid
    annotations:
      sbe_type:
        tag: sbe_type
        value: UUID
      sbe_primitive_type:
        tag: sbe_primitive_type
        value: uint8
    description: A random UUID of RFC 4122's version 4, written as 32 hexadecimal
      digits in five groups joined by hyphens.
    comments:
    - On the wire it is 16 octets. The pattern checks the version digit and the variant
      bits that RFC 4122 sets for a random UUID.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    see_also:
    - https://www.rfc-editor.org/rfc/rfc4122
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
  fixp_nanotime:
    name: fixp_nanotime
    definition_uri: https://w3id.org/lmodel/fixp/FixpNanotime
    annotations:
      sbe_type:
        tag: sbe_type
        value: nanotime
      sbe_primitive_type:
        tag: sbe_primitive_type
        value: uint64
    description: A moment, counted in nanoseconds since the Unix epoch and held in
      64 unsigned bits.
    comments:
    - The datatype table names no epoch; the usage examples in the specification's
      appendix A use the Unix epoch.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    typeof: integer
    base: int
    uri: xsd:integer
    unit:
      ucum_code: ns
    minimum_value: 0
    maximum_value: 18446744073709551615
  fixp_delta_millisecs:
    name: fixp_delta_millisecs
    definition_uri: https://w3id.org/lmodel/fixp/FixpDeltaMillisecs
    annotations:
      sbe_type:
        tag: sbe_type
        value: DeltaMillisecs
      sbe_primitive_type:
        tag: sbe_primitive_type
        value: uint32
    description: A length of time in whole milliseconds, held in 32 unsigned bits.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    typeof: integer
    base: int
    uri: xsd:integer
    unit:
      ucum_code: ms
    minimum_value: 0
    maximum_value: 4294967295
  fixp_object:
    name: fixp_object
    definition_uri: https://w3id.org/lmodel/fixp/FixpObject
    annotations:
      sbe_type:
        tag: sbe_type
        value: Object
    description: Octets that FIXP passes through without reading them, written here
      in base64.
    comments:
    - FIXP leaves the wire form to the encoding. Base64 (RFC 4648, section 4) is this
      schema's choice for writing the octets in YAML and JSON.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    typeof: string
    base: str
    uri: xsd:base64Binary
    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
  fixp_string:
    name: fixp_string
    definition_uri: https://w3id.org/lmodel/fixp/FixpString
    annotations:
      sbe_type:
        tag: sbe_type
        value: CharacterString
    description: Text, in UTF-8.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    typeof: string
    base: str
    uri: xsd:string
enums:
  FixpFlowType:
    name: FixpFlowType
    definition_uri: https://w3id.org/lmodel/fixp/FixpFlowType
    annotations:
      sbe_name:
        tag: sbe_name
        value: FlowType
      sbe_encoding_type:
        tag: sbe_encoding_type
        value: uint8
    description: How surely a flow is delivered. A flow is what one side of a session
      sends the other, leaving out session messages.
    comments:
    - The values are listed from the strongest guarantee to none.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    permissible_values:
      Recoverable:
        text: Recoverable
        description: Every message arrives once and in order; the receiver asks for
          any gap to be sent again.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '0'
      Idempotent:
        text: Idempotent
        description: No message takes effect twice; the sender hears of a gap and
          its application decides what to resend.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '1'
      Unsequenced:
        text: Unsequenced
        description: Messages carry no sequence number, and none is ever resent.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '2'
      None:
        text: None
        description: This side sends no application messages at all.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '3'
  FixpMulticastFlowType:
    name: FixpMulticastFlowType
    definition_uri: https://w3id.org/lmodel/fixp/FixpMulticastFlowType
    annotations:
      repository_code_set:
        tag: repository_code_set
        value: FlowCodeSet
    description: The delivery guarantee a multicast topic announces for its flow.
    comments:
    - Section 5 and the repository file allow these two values. Section 3 allows a
      multicast Idempotent alone, and the SBE schema reuses the four-value FlowType,
      which tests/upstream_departures.yaml records.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    permissible_values:
      Recoverable:
        text: Recoverable
        description: Sequenced; a listener gets a lost message back over a separate
          unicast session.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '0'
      Idempotent:
        text: Idempotent
        description: Sequenced, so a listener can see a loss, but nothing lost comes
          back.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '1'
  FixpNegotiationRejectCode:
    name: FixpNegotiationRejectCode
    definition_uri: https://w3id.org/lmodel/fixp/FixpNegotiationRejectCode
    annotations:
      sbe_name:
        tag: sbe_name
        value: NegotiationRejectCode
      sbe_encoding_type:
        tag: sbe_encoding_type
        value: uint8
    description: Why a server refused to create a session.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    permissible_values:
      Credentials:
        text: Credentials
        description: The server could not identify the client, or would not let it
          in.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '0'
      FlowTypeNotSupported:
        text: FlowTypeNotSupported
        description: The server does not offer the flow type the client asked to send.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '1'
      DuplicateId:
        text: DuplicateId
        description: The client chose a session identifier that is not new.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '2'
      Unspecified:
        text: Unspecified
        description: Some reason the other values do not name.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '3'
  FixpEstablishmentRejectCode:
    name: FixpEstablishmentRejectCode
    definition_uri: https://w3id.org/lmodel/fixp/FixpEstablishmentRejectCode
    annotations:
      sbe_name:
        tag: sbe_name
        value: EstablishmentRejectCode
      sbe_encoding_type:
        tag: sbe_encoding_type
        value: uint8
    description: Why a server would not bind the session to this transport.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    permissible_values:
      Unnegotiated:
        text: Unnegotiated
        description: The session was never negotiated, or it has been finalized and
          needs a new negotiation.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '0'
      AlreadyEstablished:
        text: AlreadyEstablished
        description: The server had already acknowledged a binding, so this request
          repeats it.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '1'
      SessionBlocked:
        text: SessionBlocked
        description: The client may not use this session.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '2'
      KeepaliveInterval:
        text: KeepaliveInterval
        description: The client's keep-alive interval is outside what the server accepts.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '3'
      Credentials:
        text: Credentials
        description: The server could not identify the client, or would not let it
          in.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '4'
      Unspecified:
        text: Unspecified
        description: Some reason the other values do not name.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '5'
  FixpRetransmitRejectCode:
    name: FixpRetransmitRejectCode
    definition_uri: https://w3id.org/lmodel/fixp/FixpRetransmitRejectCode
    annotations:
      sbe_name:
        tag: sbe_name
        value: RetransmitRejectCode
      sbe_encoding_type:
        tag: sbe_encoding_type
        value: uint8
    description: Why a party will not resend the messages its peer asked for.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    permissible_values:
      OutOfRange:
        text: OutOfRange
        description: The range asked for runs past the sequence numbers sent so far.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '0'
      InvalidSession:
        text: InvalidSession
        description: The session is unknown, or the one asking may not read it.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '1'
      RequestLimitExceeded:
        text: RequestLimitExceeded
        description: The request asks for more messages than the sender resends at
          once.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '2'
  FixpTerminationCode:
    name: FixpTerminationCode
    definition_uri: https://w3id.org/lmodel/fixp/FixpTerminationCode
    annotations:
      sbe_name:
        tag: sbe_name
        value: TerminationCode
      sbe_encoding_type:
        tag: sbe_encoding_type
        value: uint8
    description: Why a party releases a session from its transport.
    comments:
    - The specification lists these values without saying what each one means, apart
      from ReRequestInProgress, so the descriptions read their names.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_core
    permissible_values:
      Finished:
        text: Finished
        description: An ordinary release, with no error.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '0'
      UnspecifiedError:
        text: UnspecifiedError
        description: An error that the other values do not name.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '1'
      ReRequestOutOfBounds:
        text: ReRequestOutOfBounds
        description: The peer asked again for messages outside the range sent.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '2'
      ReRequestInProgress:
        text: ReRequestInProgress
        description: The peer asked again for messages while its earlier request was
          unanswered.
        annotations:
          sbe_value:
            tag: sbe_value
            value: '3'
  FixpSessionKind:
    name: FixpSessionKind
    definition_uri: https://w3id.org/lmodel/fixp/FixpSessionKind
    description: The two forms of FIXP session.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_exchange
    permissible_values:
      point_to_point:
        text: point_to_point
        description: A client and a server over a transport that carries messages
          both ways, with one flow each way.
        annotations:
          fixp_section:
            tag: fixp_section
            value: '4'
      multicast:
        text: multicast
        description: One publisher, one flow and many listeners, on a transport that
          only carries messages outward.
        annotations:
          fixp_section:
            tag: fixp_section
            value: '5'
  FixpParty:
    name: FixpParty
    definition_uri: https://w3id.org/lmodel/fixp/FixpParty
    description: The side that sends a step.
    from_schema: https://w3id.org/lmodel/fixp/schema/fixp_exchange
    permissible_values:
      client:
        text: client
        description: The party that opens a session with a server.
      server:
        text: server
        description: The party that accepts the client's session.
      publisher:
        text: publisher
        description: The only party that sends in a multicast.
