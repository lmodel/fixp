id: https://example.org/fixp/venue-a-order-entry
description: Order entry with venue A. The client sends an idempotent flow, the server a recoverable one.
client_stack:
  application_fix_version: FIX.Latest
  message_encoding: Simple Binary Encoding
  encoding_version: "1.0"
  framing: Simple Open Framing Header
  supported_flow_types:
    - Idempotent
  tls_version: "1.3"
  authentication_methods:
    - TLS client certificate
  credentials_format: >-
    An HMAC-SHA256 signature of the session identifier and request time, keyed with
    the secret the venue issued
  transports:
    - TCP
server_stack:
  application_fix_version: FIX.Latest
  message_encoding: Simple Binary Encoding
  encoding_version: "1.0"
  framing: Simple Open Framing Header
  supported_flow_types:
    - Recoverable
  shortest_keepalive_interval: 100
  longest_keepalive_interval: 60000
  retransmission_limit: 1000
  tls_version: "1.3"
  transports:
    - TCP
