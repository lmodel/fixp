[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds;
# the import package stays fixp. PyPI publishing is off.
name = "fixp-linkml"
description = "FIX Performance Session Layer (FIXP) 1.0 (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.12.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "linkml>=1.12.1",
    "lxml>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fixp"]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/fixp/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/fixp/datamodel/fixp_pydantic.py",
  "src/fixp/datamodel/fixp.py",
  # The upstream's files, copied as published; the neighbours' adapt copies,
  # copied as released; and files copied in by the KTL sidecar sync or written
  # by npm, not by hand.
  "upstream/*",
  "tests/neighbours/*",
  "tests/upstream/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
# ND is the NoDerivatives of CC BY-ND, the licence of FIX's specification.
nd = "nd"
# FIX's files spell the message RetransmitReject this way, and the schema quotes them.
Restransmit = "Restransmit"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/fixp/datamodel/fixp_pydantic.py",
  "src/fixp/datamodel/fixp.py",
  "upstream/*",
  "tests/neighbours/*",
  "tests/upstream/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]
